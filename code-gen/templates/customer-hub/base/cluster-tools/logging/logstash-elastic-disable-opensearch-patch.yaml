# Patches logstash-elastic StatefulSet to redirect probes from port 8080 (opensearch main pipeline) to port 8084 (customer pipeline).
# Uncommented by generate-cluster-state.sh when LOGSTASH_CHUB_CUSTOMER_PIPELINE_ENABLED=true for customer-hub.
# Required because opensearch is disabled in customer-hub; probes targeting port 8080 would fail.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logstash-elastic
  namespace: elastic-stack-logging
spec:
  template:
    spec:
      containers:
      - name: logstash
        readinessProbe:
          httpGet:
            port: 8084
        startupProbe:
          httpGet:
            port: 8084
        volumeMounts:
        - name: logstash-pipelines
          mountPath: /usr/share/logstash/config/pipelines.yml
          subPath: pipelines.yml
      volumes:
      - name: logstash-pipelines
        configMap:
          name: logstash-pipelines
          items:
          - key: pipelines.yml
            path: pipelines.yml
