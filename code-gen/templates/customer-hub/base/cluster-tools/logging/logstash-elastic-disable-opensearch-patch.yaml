# Patches logstash-elastic StatefulSet to redirect probes and mount the customer pipelines config.
# Uncommented by generate-cluster-state.sh when LOGSTASH_CHUB_CUSTOMER_PIPELINE_ENABLED=true for customer-hub.
# When true: logstash-elastic STS is deployed → patch applied to redirect probes and mount pipelines config.
# When false (customer-hub default): remains commented → logstash-elastic STS is not deployed.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logstash-elastic
  namespace: elastic-stack-logging
spec:
  template:
    spec:
      containers:
      - name: logstash
        readinessProbe:
          httpGet:
            port: 8084
        startupProbe:
          httpGet:
            port: 8084
        volumeMounts:
        - name: logstash-pipelines
          mountPath: /usr/share/logstash/config/pipelines.yml
          subPath: pipelines.yml
      volumes:
      - name: logstash-pipelines
        configMap:
          name: logstash-pipelines
          items:
          - key: pipelines.yml
            path: pipelines.yml
