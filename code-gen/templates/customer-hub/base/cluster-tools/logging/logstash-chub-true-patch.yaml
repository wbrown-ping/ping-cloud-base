# Applied when LOGSTASH_CHUB_CUSTOMER_PIPELINE_ENABLED=true for customer-hub.
# Configures logstash-elastic to run only the customer pipeline (disables main and dlq pipelines).
# FluentBit outputs remain [logstash_customer_out + s3_app_out] as set by disable-opensearch-base-patch.yaml.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-pipelines
  namespace: elastic-stack-logging
data:
  pipelines.yml: |
    - pipeline.id: customer
      path.config: "/usr/share/logstash/pipeline/customer"
