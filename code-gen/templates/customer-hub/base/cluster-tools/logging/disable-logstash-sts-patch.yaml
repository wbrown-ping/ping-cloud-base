# Patch to delete the logstash-elastic StatefulSet (customer pipeline) from customer-hub.
# Conditionally toggled by git-ops-command.sh based on the LOGSTASH_CHUB_CUSTOMER_PIPELINE_ENABLED flag (with INVERTED logic).
# When LOGSTASH_CHUB_CUSTOMER_PIPELINE_ENABLED=false (default for chub): this patch is uncommented → STS is deleted (pipeline disabled).
# When LOGSTASH_CHUB_CUSTOMER_PIPELINE_ENABLED=true: this patch is commented → STS exists (pipeline enabled).
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logstash-elastic
  namespace: elastic-stack-logging
$patch: delete
