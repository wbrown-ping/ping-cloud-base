# Disables OpenSearch and reconfigures logstash-elastic for customer-hub.
# Always applied in customer-hub (opensearch is not deployed in any customer-hub region).
# - Deletes OpenSearchCluster and os-controller-manager
# - Removes opensearch-bootstrap init container (os-bootstrap-creds secret does not exist in customer-hub)
# - Redirects logstash-elastic probes from port 8080 (opensearch pipeline) to 8084 (customer pipeline)
# - Overwrites FluentBit outputs to [logstash_customer_out + s3_app_out] (removing opensearch output)
---

apiVersion: opensearch.opster.io/v1
kind: OpenSearchCluster
metadata:
  name: opensearch-cluster
  namespace: elastic-stack-logging
$patch: delete

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-controller-manager
  namespace: elastic-stack-logging
$patch: delete

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logstash-elastic
  namespace: elastic-stack-logging
spec:
  template:
    spec:
      initContainers:
      - name: opensearch-bootstrap
        $patch: delete
      containers:
      - name: logstash
        readinessProbe:
          httpGet:
            port: 8084
        startupProbe:
          httpGet:
            port: 8084

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-pipeline-outputs
  namespace: elastic-stack-logging
data:
  pipeline-outputs.conf: |
    [OUTPUT]
        Name                http
        Alias               logstash_customer_out
        Match               elk.kube.*
        Host                logstash-elastic.elastic-stack-logging
        Port                8084
        Format              json
        Retry_Limit         False
        compress            gzip
        net.keepalive_idle_timeout  10
        net.keepalive_max_recycle   100
        storage.total_limit_size  3000M

    [OUTPUT]
        Name                http
        Alias               s3_app_out
        Match               *
        Host                logstash-elastic-s3.elastic-stack-logging
        Port                8081
        Format              json
        Retry_Limit         False
        compress            gzip
        net.keepalive_idle_timeout  10
        net.keepalive_max_recycle   100
        storage.total_limit_size  3000M
