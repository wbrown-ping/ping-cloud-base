# Strategic merge patch to disable customer pipeline output in FluentBit for customer-hub.
# Conditionally enabled by generate-cluster-state.sh when LOGSTASH_CHUB_CUSTOMER_PIPELINE_ENABLED=false (customer-hub default).
# When active: FluentBit outputs only to S3 (no logstash-elastic customer pipeline output).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-pipeline-outputs
  namespace: elastic-stack-logging
data:
  pipeline-outputs.conf: |
    [OUTPUT]
        Name                http
        Alias               s3_app_out
        Match               *
        workers             3
        Host                logstash-elastic-s3.elastic-stack-logging
        Port                8081
        Format              json
        Retry_Limit         False
        compress            gzip
        net.keepalive_idle_timeout  10
        net.keepalive_max_recycle   100
        storage.total_limit_size  4000M
