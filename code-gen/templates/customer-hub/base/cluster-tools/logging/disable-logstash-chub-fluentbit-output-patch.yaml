# Overwrite the fluent-bit-pipeline-outputs ConfigMap to remove the customer pipeline output.
# Applied at the CSR region kust level (AFTER disable-opensearch-base-patch.yaml) when
# LOGSTASH_CHUB_CUSTOMER_PIPELINE_DISABLED=true (default for customer-hub).
# This ensures only S3 output is active when the customer pipeline is disabled.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-pipeline-outputs
  namespace: elastic-stack-logging
data:
  pipeline-outputs.conf: |
    [OUTPUT]
        Name                http
        Alias               s3_app_out
        Match               *
        # Default is workers=1 for all outputs; increased for s3 to handle high-volume.
        workers             3
        Host                logstash-elastic-s3.elastic-stack-logging
        Port                8081
        Format              json
        Retry_Limit         False
        compress            gzip
        net.keepalive_idle_timeout  10
        net.keepalive_max_recycle   100
        storage.total_limit_size  4000M
