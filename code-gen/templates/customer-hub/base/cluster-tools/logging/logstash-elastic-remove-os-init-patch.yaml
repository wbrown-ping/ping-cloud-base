# Removes opensearch init containers from logstash-elastic StatefulSet for primary customer-hub regions.
# Uncommented by generate-cluster-state.sh when primary CHUB + LOGSTASH_CHUB_CUSTOMER_PIPELINE_ENABLED=true.
# Primary customer-hub has no opensearch deployment, so init containers that wait for opensearch must be removed.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logstash-elastic
  namespace: elastic-stack-logging
spec:
  template:
    spec:
      initContainers:
      - name: opensearch-bootstrap
        $patch: delete
