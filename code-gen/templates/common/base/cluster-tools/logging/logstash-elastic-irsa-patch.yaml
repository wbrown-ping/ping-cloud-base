# Add IRSA role annotation to logstash-elastic service account.
# Always active for non-chub CDEs (logstash-elastic SA always exists).
# For customer-hub: commented out by generate-cluster-state.sh when LOGSTASH_CHUB_CUSTOMER_PIPELINE_ENABLED=false (default),
# uncommented when LOGSTASH_CHUB_CUSTOMER_PIPELINE_ENABLED=true.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logstash-elastic
  namespace: elastic-stack-logging
  annotations:
    purpose: service-account-for-logstash-elastic
    ${IRSA_LOGSTASH_ANNOTATION_KEY_VALUE}
