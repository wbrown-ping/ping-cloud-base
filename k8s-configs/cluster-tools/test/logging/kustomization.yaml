kind: Kustomization
apiVersion: kustomize.config.k8s.io/v1beta1

namespace: elastic-stack-logging

resources:
- ../../base/logging/

patchesStrategicMerge:
- elastic-stack/opensearch/os-limits.yaml
- elastic-stack/logstash/hpa-limits.yaml
- elastic-stack/logstash/logstash-limits.yaml
# Conditionally enabled by git-ops-command.sh when LOGSTASH_CHUB_CUSTOMER_PIPELINE_ENABLED=true.
#- elastic-stack/logstash/logstash-elastic-limits.yaml # logstash.yaml
#- elastic-stack/logstash/logstash-elastic-hpa-limits.yaml # logstash.yaml