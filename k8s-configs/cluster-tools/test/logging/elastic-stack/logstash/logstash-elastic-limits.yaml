# Resource limits for logstash-elastic (customer pipeline component).
# Conditionally applied by git-ops-command.sh when LOGSTASH_CHUB_CUSTOMER_PIPELINE_ENABLED=true (or for non-customer-hub CDEs).
# Defines test-tier specific CPU/memory guarantees and pipeline configuration for the customer pipeline STS.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logstash-elastic
spec:
  template:
    spec:
      containers:
        - name: logstash
          resources:
            # Guaranteed QoS (requests = limits).
            # Ensures dedicated CPU & Mem reservation for Logstash to avoid
            # CPU throttling &noisy-neighbor interference
            limits:
              cpu: "3"
              memory: 9Gi
            requests:
              cpu: "3"
              memory: 9Gi
          env:
            - name: LS_JAVA_OPTS
              # Heap/direct split sized for stable GC and IO buffer headroom.
              value: '-Xms4g -Xmx4g -XX:MaxDirectMemorySize=2g'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-pipelines
data:
  pipelines.yml: |
    - pipeline.id: main
      path.config: "/usr/share/logstash/pipeline/main"
      # One worker keeps test behavior deterministic and stable.
      pipeline.workers: 1
      # Batch 500 balances throughput and memory in test runs.
      pipeline.batch.size: 500
    - pipeline.id: customer
      path.config: "/usr/share/logstash/pipeline/customer"
      # One worker avoids unnecessary parallelism for test traffic.
      pipeline.workers: 1
      # Batch 500 keeps customer path memory predictable in tests.
      pipeline.batch.size: 500
    - pipeline.id: dlq
      path.config: "/usr/share/logstash/pipeline/dlq"
      # Single worker preserves DLQ replay order.
      pipeline.workers: 1
      # Batch 250 limits replay burst size during failure-path tests.
      pipeline.batch.size: 250
