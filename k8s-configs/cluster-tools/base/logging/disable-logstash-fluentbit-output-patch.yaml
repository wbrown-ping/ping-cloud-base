# Patch to remove the customer pipeline (port 8084) output from FluentBit in customer-hub.
# Applied together with disable-logstash-sts-patch.yaml when LOGSTASH_CHUB_CUSTOMER_PIPELINE_ENABLED=false.
# Retains only the s3_app_out output (raw S3 archiving) since logstash-elastic-s3 always runs.
# Note: logstash_elk_out (port 8080, main pipeline) is already removed by disable-opensearch-base-patch.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-pipeline-outputs
  namespace: elastic-stack-logging
data:
  pipeline-outputs.conf: |
    [OUTPUT]
        Name                http
        Alias               s3_app_out
        Match               *
        Host                logstash-elastic-s3.elastic-stack-logging
        Port                8081
        Format              json
        Retry_Limit         False
        compress            gzip
        net.keepalive_idle_timeout  10
        net.keepalive_max_recycle   100
        storage.total_limit_size  3000M
