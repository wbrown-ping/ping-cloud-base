# Strategic merge patch to disable customer pipeline output in FluentBit for customer-hub.
# Conditionally enabled by git-ops-command.sh based on LOGSTASH_CHUB_CUSTOMER_PIPELINE_DISABLED flag.
# When DISABLED=true (customer-hub default): line is uncommented → FluentBit outputs only to S3.
# When DISABLED=false (other CDEs): line is commented → FluentBit outputs to both S3 and customer pipeline.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-pipeline-outputs
  namespace: elastic-stack-logging
data:
  pipeline-outputs.conf: |
    [OUTPUT]
        Name                http
        Alias               s3_app_out
        Match               *
        # Default is workers=1 for all outputs; increased for s3 to handle high-volume.
        workers             3
        Host                logstash-elastic-s3.elastic-stack-logging
        Port                8081
        Format              json
        Retry_Limit         False
        compress            gzip
        net.keepalive_idle_timeout  10
        net.keepalive_max_recycle   100
        storage.total_limit_size  4000M
