# Overwrites fluent-bit-pipeline-outputs ConfigMap to keep only S3 output, removing the customer pipeline output (port 8084).
# The deployed copy of this patch lives in the generated CSR (code-gen/templates/customer-hub/base/cluster-tools/logging/).
# That CSR copy is toggled by generate-cluster-state.sh when LOGSTASH_CHUB_CUSTOMER_PIPELINE_ENABLED=false.
# Must be applied AFTER disable-opensearch-base-patch.yaml, which always produces [customer+S3] outputs.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-pipeline-outputs
  namespace: elastic-stack-logging
data:
  pipeline-outputs.conf: |
    [OUTPUT]
        Name                http
        Alias               s3_app_out
        Match               *
        # Default is workers=1 for all outputs; increased for s3 to handle high-volume.
        workers             3
        Host                logstash-elastic-s3.elastic-stack-logging
        Port                8081
        Format              json
        Retry_Limit         False
        compress            gzip
        net.keepalive_idle_timeout  10
        net.keepalive_max_recycle   100
        storage.total_limit_size  4000M
