# Strategic merge patch to enable port 8084 (customer pipeline) output in FluentBit.
# Applied when LOGSTASH_CHUB_CUSTOMER_PIPELINE_ENABLED=true.
# This patch adds the logstash_customer_out section to the pipeline-outputs ConfigMap.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-pipeline-outputs
  namespace: elastic-stack-logging
data:
  pipeline-outputs.conf: |
    [OUTPUT]
        Name                http
        Alias               logstash_customer_out
        Match               elk.kube.*
        workers             2
        Host                logstash-elastic.elastic-stack-logging
        Port                8084
        Format              json
        Retry_Limit         10
        compress            gzip
        net.keepalive_idle_timeout  10
        net.keepalive_max_recycle   100
        storage.total_limit_size  2000M
