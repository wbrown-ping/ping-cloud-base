kind: Kustomization
apiVersion: kustomize.config.k8s.io/v1beta1

resources:
- storage.yaml
# These base resources are always enabled. Customer pipeline port 8084 is conditionally added by patches.
- logstash.yaml
- customer_pipelines
- logstash-s3.yaml
- hpa.yaml
- unused-pv-cleanup.yaml
- secret.yaml
- pdb.yaml

patchesStrategicMerge:
  # This patch is conditionally enabled by git-ops-command.sh based on LOGSTASH_CHUB_CUSTOMER_PIPELINE_DISABLED flag.
  # When true (default for customer-hub): line is uncommented → removes port 8084 from logstash-elastic STS (customer pipeline disabled).
  # When false (other CDEs): line is commented → port 8084 stays in logstash-elastic STS (customer pipeline enabled).
  #- disable-logstash-chub-sts-patch.yaml
  # This patch is conditionally enabled by git-ops-command.sh based on ENABLE_IMPOSSIBLE_LOGIN_DASHBOARD flag (true/false).
  #- patch-opensearch-bootstrap-pf-impossible-login.yaml
