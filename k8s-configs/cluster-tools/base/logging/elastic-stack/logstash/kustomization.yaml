kind: Kustomization
apiVersion: kustomize.config.k8s.io/v1beta1

resources:
- storage.yaml
# These resources are conditionally toggled by git-ops-command.sh based on LOGSTASH_CHUB_CUSTOMER_PIPELINE_ENABLED flag.
# When true (other CDEs default): line is uncommented → logstash-elastic STS deployed with customer pipeline.
# When false (customer-hub default): line is commented → logstash-elastic STS not deployed.
#- logstash.yaml
#- customer_pipelines
- logstash-s3.yaml
- hpa.yaml
- unused-pv-cleanup.yaml
- secret.yaml
- pdb.yaml

patchesStrategicMerge: []
# NOTE: The following patches are ONLY in CSR code-gen templates (not in PCB):
# - logstash-elastic-disable-opensearch-patch: Probe redirection from 8080→8084
# - logstash-elastic-remove-os-init-patch: Remove opensearch-bootstrap init container
# These patches are generated at CSR deployment time based on LOGSTASH_CHUB_CUSTOMER_PIPELINE_ENABLED.
