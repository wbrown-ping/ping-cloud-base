# Strategic merge patch to enable port 8084 (customer pipeline) for logstash-elastic StatefulSet.
# Applied when LOGSTASH_CHUB_CUSTOMER_PIPELINE_ENABLED=true.
# This patch adds the customer-pipeline port to the logstash container.
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logstash-elastic
  namespace: elastic-stack-logging
spec:
  template:
    spec:
      containers:
      - name: logstash
        ports:
        - containerPort: 8084
          name: customer-pipeline
