# Patch to delete the logstash-elastic StatefulSet (customer pipeline) from customer-hub.
# Conditionally toggled by git-ops-command.sh based on the LOGSTASH_CHUB_CUSTOMER_PIPELINE_ENABLED flag.
# When LOGSTASH_CHUB_CUSTOMER_PIPELINE_ENABLED=false (default): this patch is active → STS is deleted.
# When LOGSTASH_CHUB_CUSTOMER_PIPELINE_ENABLED=true: this patch is commented out → STS is deployed.
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logstash-elastic
$patch: delete
