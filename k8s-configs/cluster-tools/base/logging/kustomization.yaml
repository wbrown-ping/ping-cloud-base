kind: Kustomization
apiVersion: kustomize.config.k8s.io/v1beta1

resources:
- elastic-stack
- fluentbit

patchesStrategicMerge:
  # Below patch is conditionally toggled by git-ops-command.sh
  # based on the LOGSTASH_CHUB_CUSTOMER_PIPELINE_ENABLED flag.
  # false (default): patch is uncommented → FluentBit port 8084 output is removed in customer-hub.
  # true: patch is commented out → FluentBit sends to logstash-elastic:8084 (customer pipeline active).
  # Only applicable to customer-hub. For other environments this patch is irrelevant.
  #- disable-logstash-fluentbit-output-patch.yaml
