# HPA (Horizontal Pod Autoscaler) limits for logstash-elastic-s3 (S3 archiving component).
# Always applied; defines min/max replicas for auto-scaling the S3 pipeline STS.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: logstash-elastic-s3
spec:
  minReplicas: 3
  maxReplicas: 8
