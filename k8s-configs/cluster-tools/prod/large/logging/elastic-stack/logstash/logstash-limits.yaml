# Resource limits for logstash-elastic-s3 (S3 archiving component).
# Always applied; defines memory and CPU guarantees for the S3 pipeline STS.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logstash-elastic-s3
spec:
  template:
    spec:
      containers:
        - name: logstash
          resources:
            # Guaranteed QoS (requests = limits).
            # Ensures dedicated CPU & Mem reservation for Logstash to avoid
            # CPU throttling &noisy-neighbor interference
            limits:
              cpu: "5"
              memory: 10Gi
            requests:
              cpu: "5"
              memory: 10Gi
          env:
            - name: LS_JAVA_OPTS
              # Heap/direct split sized for stable GC and IO buffer headroom.
              value: '-Xms4608m -Xmx4608m -XX:MaxDirectMemorySize=2g'
