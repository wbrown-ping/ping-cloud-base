kind: Kustomization
apiVersion: kustomize.config.k8s.io/v1beta1

namespace: elastic-stack-logging

resources:
- ../../../base/logging/

patchesStrategicMerge:
- elastic-stack/logstash/logstash-limits.yaml
- elastic-stack/logstash/hpa-limits.yaml
- elastic-stack/opensearch/os-limits.yaml
# Below patch is conditionally toggled by git-ops-command.sh
# based on the LOGSTASH_CHUB_CUSTOMER_PIPELINE_ENABLED flag.
# false (chub default): uncommented → logstash-elastic STS deleted.
# true: commented → logstash-elastic STS deployed (customer pipeline enabled).
#- disable-logstash-sts-patch.yaml
