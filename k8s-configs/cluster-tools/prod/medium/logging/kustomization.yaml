kind: Kustomization
apiVersion: kustomize.config.k8s.io/v1beta1

namespace: elastic-stack-logging

resources:
- ../../../base/logging/

patchesStrategicMerge:
- elastic-stack/logstash/logstash-limits.yaml
- elastic-stack/logstash/hpa-limits.yaml
# This patch is conditionally enabled by git-ops-command.sh based on LOGSTASH_CHUB_CUSTOMER_PIPELINE_ENABLED (same as logstash.yaml).
#- elastic-stack/logstash/logstash-elastic-limits.yaml
#- elastic-stack/logstash/logstash-elastic-hpa-limits.yaml
- elastic-stack/opensearch/os-limits.yaml
