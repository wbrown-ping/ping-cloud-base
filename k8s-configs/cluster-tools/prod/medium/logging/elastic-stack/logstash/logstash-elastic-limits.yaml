# Resource limits for logstash-elastic (customer pipeline component).
# Conditionally applied by git-ops-command.sh when LOGSTASH_CHUB_CUSTOMER_PIPELINE_ENABLED=true (or for non-customer-hub CDEs).
# Defines prod-tier specific CPU/memory guarantees and pipeline configuration for the customer pipeline STS.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logstash-elastic
spec:
  template:
    spec:
      containers:
        - name: logstash
          resources:
            limits:
              cpu: "5"
              memory: 12Gi
            requests:
              cpu: "5"
              memory: 12Gi
          env:
            - name: LS_JAVA_OPTS
              # Heap/direct split sized for stable GC and IO buffer headroom.
              value: '-Xms5g -Xmx5g -XX:MaxDirectMemorySize=2560m'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-pipelines
data:
  pipelines.yml: |
    - pipeline.id: main
      path.config: "/usr/share/logstash/pipeline/main"
      # One worker keeps main pipeline latency stable at medium tier.
      pipeline.workers: 1
      # Batch 750 increases throughput with acceptable heap overhead.
      pipeline.batch.size: 750
    - pipeline.id: customer
      path.config: "/usr/share/logstash/pipeline/customer"
      # One worker avoids thread contention with main pipeline.
      pipeline.workers: 1
      # Batch 750 matches medium customer throughput target.
      pipeline.batch.size: 750
    - pipeline.id: dlq
      path.config: "/usr/share/logstash/pipeline/dlq"
      # Single worker preserves DLQ replay order.
      pipeline.workers: 1
      # Batch 250 caps DLQ replay burst size.
      pipeline.batch.size: 250
