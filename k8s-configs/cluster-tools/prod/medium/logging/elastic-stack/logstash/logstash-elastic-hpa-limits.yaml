# HPA (Horizontal Pod Autoscaler) limits for logstash-elastic (customer pipeline component).
# Conditionally applied by git-ops-command.sh when LOGSTASH_CHUB_CUSTOMER_PIPELINE_ENABLED=true (or for non-customer-hub CDEs).
# Defines prod-tier specific min/max replicas for auto-scaling the customer pipeline STS.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: logstash-elastic
spec:
  minReplicas: 2
  maxReplicas: 6
