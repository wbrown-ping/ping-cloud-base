# Patch to delete the logstash-elastic StatefulSet (customer pipeline) from customer-hub.
# Conditionally toggled by git-ops-command.sh based on the DISABLE_LOGSTASH_CUSTOMER_PIPELINE flag.
# When DISABLE_LOGSTASH_CUSTOMER_PIPELINE=true (default): this patch is active → STS is deleted.
# When DISABLE_LOGSTASH_CUSTOMER_PIPELINE=false: this patch is commented out → STS is deployed.
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logstash-elastic
$patch: delete
